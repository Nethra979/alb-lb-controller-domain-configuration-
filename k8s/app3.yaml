apiVersion: apps/v1
kind: Deployment
metadata: 
  name: app3-deployment
  labels: 
    app: app3
    version: v3
spec: 
  replicas: 2
  selector: 
    matchLabels: 
      app: app3

template: 
  metadata:
    labels:
      app: app3
      version: v3 
 
  spec:
    containers: 
      -name: app3-container
      image: kkfunda123/app3:3.0.0 
      imaagePullPolicy: Always
      ports: 
        -containerPosrt: 5000
        name: http

      resources: 
        requests: 
          memory: "128mi"
          cpu: "100m"
        limits: 
          memory: "256mi"
          cpu: "200m"
      livenessProbe: 
        httpGet: 
          path: /health
          port: 5000
        initialDelaySeconds: 30
        periodSeconds: 10
      readynessProbe: 
        httpdGet: 
          path: /health
          port: 5000
        initialDelaySeconds: 5
        periodSeconds: 5


---

apiVersion: v1
kind: Services
metadata:
   name: app1-service
   annotations: 
      alb.ingress.kubernetes.io/healthcheck-path: /health
spec: 
  selector:
     app: app3
  ports: 
    -port: 80 
    targetPort: 5000
    protocol: TCP
  type: ClusterIP 